[package]
name = "walkthrough"
version = "0.4.0"
authors = ["Edgar Linton <150683481+edgar-linton@users.noreply.github.com>"]
edition = "2024"
description = "A Rust crate for recursive directory traversal."
repository = "https://github.com/edgar-linton/walkthrough"
license = "MIT OR Apache-2.0"
keywords = ["filesystem", "walkdir", "recursive", "iterator"]
categories = ["filesystem", "os"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
async = ["dep:tokio", "dep:futures-core", "dep:async-stream"]

[dependencies]
thiserror = "2.0"
tokio = { version = "1.52", features = ["fs", "rt"], optional = true }
futures-core = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
once_cell = "1.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

# Without this cargo builds these targets with the feature off, where they
# compile to zero tests; `required-features` makes it skip them instead.
[[test]]
name = "async"
required-features = ["async"]

[[test]]
name = "async_concurrency"
required-features = ["async"]

[[test]]
name = "async_dto_listing"
required-features = ["async"]

[[test]]
name = "async_filter"
required-features = ["async"]

[[test]]
name = "async_paged"
required-features = ["async"]
