name: Setup Rust
description: >
  Install the Rust toolchain pinned in rust-toolchain.toml and populate the
  build cache. Must be called after actions/checkout because it is a local
  action.

inputs:
  components:
    description: Additional rustup components beyond rust-toolchain.toml (e.g. 'llvm-tools-preview')
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: rustc -V
    - if: inputs.components != ''
      shell: bash
      run: rustup component add $(echo '${{ inputs.components }}' | tr ',' ' ')
    - uses: Swatinem/rust-cache@v2
